[package]
name = "algograph"
version = "0.5.1"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
description = "A (both directed and undirected) graph and their algorithms implemented in Rust"
repository = "https://github.com/TimeExceed/algograph"
readme = "README.md"
categories = ["algorithms", "data-structures"]
keywords = ["graph"]

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "katex.html" ]

[dependencies]
ahash = "0.8.12"
bimap = "0.6.3"
keyed_priority_queue = "0.4.2"
num-traits = "0.2.19"
petgraph = "0.8.3"
pinned-deque = "0.2.1"

[dev-dependencies]
criterion = "0.8.2"
quickcheck_macros = "1"
quickcheck = "1"
rand = "0.10.2"
rs_quickcheck_util = "0.2.0"

[[bench]]
name = "low_level_digraph_impls"
harness = false
